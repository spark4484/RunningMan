<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RunningMan</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080d; color: #dfe6f0;
    font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { background: #0b0e14; border: 1px solid #232a3a; border-radius: 6px;
    max-height: 98vh; max-width: 98vw; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="480" height="720"></canvas></div>
<script>
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---------- deterministic path & obstacles (same seed = same course) ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let course = null;
function buildCourse(seed) {
  const rng = mulberry32(seed);
  const p1 = rng() * 6.28, p2 = rng() * 6.28, p3 = rng() * 6.28;
  const obstacles = [];
  let d = 700;
  for (let i = 0; i < 1500; i++) {
    const type = rng() < 0.62 ? 'rock' : 'wall';
    const o = { d, type };
    if (type === 'rock') {
      o.off = (rng() * 2 - 1) * 0.32;      // lateral offset, fraction of path width
      o.w = 60 + rng() * 60;
      o.depth = 34;
    } else {
      o.off = (rng() * 2 - 1) * 0.30;      // gap position
      o.w = 95 + rng() * 45;               // gap width
      o.depth = 16;
    }
    obstacles.push(o);
    d += 240 + rng() * 260 + (type === 'wall' ? 80 : 0);
  }
  return {
    obstacles,
    centerX(d) {
      const amp = Math.min(1, 0.2 + d / 3500);   // starts gentle, gets windier
      return amp * (90 * Math.sin(d * 0.0018 + p1)
                  + 55 * Math.sin(d * 0.0031 + p2)
                  + 30 * Math.sin(d * 0.005  + p3));
    },
    width(d) { return Math.max(170, 260 - d * 0.008); },  // slowly narrows
  };
}

// ---------- state ----------
const me = { d: 0, x: 0, z: 0, vz: 0, alive: true };
const rival = { d: 0, x: 0, z: 0, seen: false };
let mode = 'connecting';   // connecting | waiting | countdown | running | over | peerLeft
let countdownT = 0, endMsg = '', subMsg = '', iWantRematch = false, peerReady = false;
let myIdx = 0, wins = [0, 0], best = [0, 0];
const keys = {};

// ---------- input ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowleft', 'arrowright', 'arrowdown'].includes(k)) e.preventDefault();
  keys[k] = true;
  if ((k === ' ' || k === 'w' || k === 'arrowup') && mode === 'running' && me.alive && me.z <= 0) {
    me.vz = 340; me.z = 0.01;
  }
  if ((k === 'r' || k === 'enter') && mode === 'over' && !iWantRematch) {
    iWantRematch = true;
    send({ t: 'again' });
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------- networking ----------
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}`);
function send(m) { if (ws.readyState === 1) ws.send(JSON.stringify(m)); }

ws.onopen = () => { if (mode === 'connecting') mode = 'waiting'; };
ws.onclose = () => { mode = 'peerLeft'; endMsg = 'DISCONNECTED'; subMsg = 'refresh the page'; };
ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.t === 'wait') mode = 'waiting';
  else if (m.t === 'start') {
    myIdx = m.you; wins = m.wins; best = m.best;
    course = buildCourse(m.seed);
    Object.assign(me, { d: 0, x: 0, z: 0, vz: 0, alive: true });
    Object.assign(rival, { d: 0, x: 0, z: 0, seen: false });
    iWantRematch = peerReady = false;
    mode = 'countdown'; countdownT = 3;
  }
  else if (m.t === 'peer') { rival.d = m.d; rival.x = m.x; rival.z = m.z; rival.seen = true; }
  else if (m.t === 'end') {
    mode = 'over';
    wins = m.wins; best = m.best;
    endMsg = m.win ? 'YOU WIN' : 'YOU LOSE';
    subMsg = (m.win ? 'rival ' : 'you ') + m.reason + ' at ' + m.dist + 'm — press R for rematch';
  }
  else if (m.t === 'peerReady') peerReady = true;
  else if (m.t === 'peerLeft') { mode = 'waiting'; }
};
setInterval(() => {
  if (mode === 'running' || mode === 'countdown')
    send({ t: 'state', d: me.d | 0, x: me.x | 0, z: me.z | 0 });
}, 50);

// ---------- simulation ----------
function die(reason) {
  if (!me.alive) return;
  me.alive = false;
  send({ t: 'dead', reason, d: me.d });
}

function step(dt) {
  if (mode === 'countdown') {
    countdownT -= dt;
    if (countdownT <= 0) mode = 'running';
    return;
  }
  if (mode !== 'running' || !me.alive) return;

  const speed = 240 + me.d * 0.03;   // no cap — keeps accelerating forever
  me.d += speed * dt;

  // steering scales with speed so the winding path stays (barely) survivable
  const latSpeed = Math.max(260, speed * 0.62);
  const lat = (keys['arrowright'] || keys['d'] ? latSpeed : 0) - (keys['arrowleft'] || keys['a'] ? latSpeed : 0);
  me.x += lat * dt;

  if (me.z > 0 || me.vz > 0) {
    me.z += me.vz * dt;
    me.vz -= 1250 * dt;
    if (me.z <= 0) { me.z = 0; me.vz = 0; }
  }

  const cx = course.centerX(me.d), w = course.width(me.d);
  // fell off the edge (only while on the ground — you can jump a corner!)
  if (me.z <= 2 && Math.abs(me.x - cx) > w / 2 - 6) return die('fell off the edge');

  for (const o of course.obstacles) {
    if (o.d > me.d + 60) break;
    const half = o.depth / 2 + 11;
    if (Math.abs(me.d - (o.d + o.depth / 2)) > half) continue;
    const oc = course.centerX(o.d), ow = course.width(o.d);
    if (o.type === 'rock') {
      if (me.z < 24 && Math.abs(me.x - (oc + o.off * ow)) < o.w / 2 + 9) return die('hit a rock');
    } else {
      if (Math.abs(me.x - (oc + o.off * ow)) > o.w / 2 - 10) return die('hit a wall');
    }
  }
}

// ---------- rendering ----------
function toScreen(wx, wd, camX, camD) {
  return [W / 2 + (wx - camX), H * 0.75 - (wd - camD)];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, W, H);

  if (course && mode !== 'waiting' && mode !== 'connecting') {
    const camD = me.d;
    const camX = course.centerX(me.d) * 0.7 + me.x * 0.3;

    // path ribbon
    ctx.beginPath();
    const step = 24, from = camD - 200, to = camD + 780;
    for (let d = from; d <= to; d += step) {
      const [sx, sy] = toScreen(course.centerX(d) - course.width(d) / 2, d, camX, camD);
      d === from ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    for (let d = to; d >= from; d -= step) {
      const [sx, sy] = toScreen(course.centerX(d) + course.width(d) / 2, d, camX, camD);
      ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fillStyle = '#2d3446'; ctx.fill();
    ctx.strokeStyle = '#4a5570'; ctx.lineWidth = 2; ctx.stroke();

    // obstacles
    for (const o of course.obstacles) {
      if (o.d < camD - 220 || o.d > camD + 800) continue;
      const oc = course.centerX(o.d), ow = course.width(o.d);
      if (o.type === 'rock') {
        const [sx, sy] = toScreen(oc + o.off * ow, o.d, camX, camD);
        ctx.fillStyle = '#8d99ae';
        ctx.fillRect(sx - o.w / 2, sy - o.depth, o.w, o.depth);
        ctx.strokeStyle = '#5c6478'; ctx.strokeRect(sx - o.w / 2, sy - o.depth, o.w, o.depth);
      } else {
        const gx = oc + o.off * ow;
        const L = oc - ow / 2, R = oc + ow / 2;
        const [lx, sy] = toScreen(L, o.d, camX, camD);
        const [gl] = toScreen(gx - o.w / 2, o.d, camX, camD);
        const [gr] = toScreen(gx + o.w / 2, o.d, camX, camD);
        const [rx] = toScreen(R, o.d, camX, camD);
        ctx.fillStyle = '#e63946';
        ctx.fillRect(lx, sy - 14, Math.max(0, gl - lx), 14);
        ctx.fillRect(gr, sy - 14, Math.max(0, rx - gr), 14);
        ctx.fillStyle = '#8f1d27';
        ctx.fillRect(lx, sy - 2, Math.max(0, gl - lx), 4);
        ctx.fillRect(gr, sy - 2, Math.max(0, rx - gr), 4);
      }
    }

    // rival (ghost square)
    if (rival.seen) {
      let [rx, ry] = toScreen(rival.x, rival.d, camX, camD);
      ry = Math.max(20, Math.min(H - 20, ry));
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#5ab0ff';
      ctx.fillRect(rx - 11, ry - 11 - rival.z * 0.5, 22, 22);
      ctx.globalAlpha = 1;
    }

    // me (a little square with a jump shadow)
    const [px, py] = toScreen(me.x, me.d, camX, camD);
    if (me.z > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(px, py, 12 - me.z * 0.1, 6 - me.z * 0.05, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = me.alive ? '#7cff6b' : '#666';
    ctx.fillRect(px - 11, py - 11 - me.z * 0.5, 22, 22);

    // HUD
    ctx.fillStyle = '#dfe6f0'; ctx.font = '14px ui-monospace, monospace'; ctx.textAlign = 'left';
    ctx.fillText(`you   ${me.d | 0}m · ${wins[myIdx]}W · best ${best[myIdx]}m`, 10, 22);
    ctx.fillStyle = '#5ab0ff';
    ctx.fillText(rival.seen
      ? `rival ${rival.d | 0}m · ${wins[1 - myIdx]}W · best ${best[1 - myIdx]}m`
      : 'rival …', 10, 42);
  }

  // overlays
  ctx.textAlign = 'center'; ctx.fillStyle = '#dfe6f0';
  if (mode === 'connecting') { ctx.font = '18px monospace'; ctx.fillText('connecting…', W / 2, H / 2); }
  else if (mode === 'waiting') {
    ctx.font = '20px monospace'; ctx.fillText('waiting for your rival…', W / 2, H / 2);
    ctx.font = '13px monospace'; ctx.fillStyle = '#8d99ae';
    ctx.fillText('send them this URL', W / 2, H / 2 + 26);
  }
  else if (mode === 'countdown') {
    ctx.font = 'bold 64px monospace';
    ctx.fillText(Math.ceil(countdownT), W / 2, H / 2);
    ctx.font = '13px monospace'; ctx.fillStyle = '#8d99ae';
    ctx.fillText('A/D or ←/→ steer · SPACE jump rocks · dodge red walls', W / 2, H / 2 + 40);
  }
  else if (mode === 'over' || mode === 'peerLeft') {
    ctx.fillStyle = 'rgba(6,8,13,0.75)'; ctx.fillRect(0, H / 2 - 92, W, 184);
    ctx.fillStyle = endMsg === 'YOU WIN' ? '#7cff6b' : '#e63946';
    ctx.font = 'bold 44px monospace'; ctx.fillText(endMsg, W / 2, H / 2 - 20);
    ctx.fillStyle = '#dfe6f0'; ctx.font = 'bold 22px monospace';
    ctx.fillText(`you ${wins[myIdx]} — ${wins[1 - myIdx]} rival`, W / 2, H / 2 + 12);
    ctx.font = '13px monospace'; ctx.fillStyle = '#8d99ae';
    ctx.fillText(`best: you ${best[myIdx]}m · rival ${best[1 - myIdx]}m`, W / 2, H / 2 + 34);
    ctx.fillStyle = '#dfe6f0';
    ctx.fillText(subMsg, W / 2, H / 2 + 56);
    if (iWantRematch) { ctx.fillStyle = '#8d99ae'; ctx.fillText('waiting for rival…', W / 2, H / 2 + 76); }
    else if (peerReady) { ctx.fillStyle = '#7cff6b'; ctx.fillText('rival wants a rematch!', W / 2, H / 2 + 76); }
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
